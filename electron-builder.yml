appId: com.datawatch.app
productName: DataWatch
directories:
  buildResources: build
# Only what the installed app runs: the compiled code and its icons. The project folder also holds
# recorded meetings, logs, the Whisper sources (.cache) and multi-GB models, which must never ship
# inside the app. Production dependencies from node_modules are added by electron-builder.
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
extraResources:
  - from: bin
    to: bin
    filter:
      - whisper-stream*
  # Whisper models and the voice detector. large-v3-turbo transcribes the meeting live; large-v3
  # (3 GB, more accurate) makes the final transcript after the meeting.
  - from: models
    to: models
    filter:
      - '**/*'
      - '!.gitkeep'
win:
  executableName: datawatch
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSAudioCaptureUsageDescription: Application requests access to system audio for live transcription.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
